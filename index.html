<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC Practice Hub | Free SSC Preparation</title>

<meta name="description"
content="SSC Practice Hub - Free SSC preparation platform for daily practice, PYQs, weak-topic revision and exam-style mocks.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

:root {
  --bg-base: #0B0E14;
  --text-main: #FFFFFF;
  --text-muted: #A3B8CC;

  --card-bg: rgba(255,255,255,0.025);
  --border-color: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.25);

  --blob-opacity: 0.55;

  --gradient-btn: linear-gradient(135deg,#FF6B6B,#FF8E53);
  --gradient-text: linear-gradient(135deg,#4facfe 0%,#00f2fe 100%);
}

body.light-mode {
  --bg-base: #F4F7FB;
  --text-main: #0F172A;
  --text-muted: #475569;

  --card-bg: rgba(255,255,255,0.65);
  --border-color: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.20);

  --blob-opacity: 0.25;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  font-family:'Inter',sans-serif;
  background:var(--bg-base);
  color:var(--text-main);
  line-height:1.6;
  overflow-x:hidden;
  transition:background-color .4s ease,color .4s ease;
}

/* ================= BACKGROUND ================= */

.aurora-bg {
  position:fixed;
  inset:0;
  z-index:-2;
  background:var(--bg-base);
  overflow:hidden;
  transition:background-color .4s ease;
}

.aurora-blob {
  position:absolute;
  border-radius:50%;
  filter:blur(140px);
  opacity:var(--blob-opacity);
  animation:drift 22s infinite alternate ease-in-out;
  will-change:transform;
}

.blob-1 {
  top:-10%;
  left:-10%;
  width:50vw;
  height:50vw;
  background:#5D26C1;
}

.blob-2 {
  right:-10%;
  bottom:-20%;
  width:60vw;
  height:60vw;
  background:#00A8FF;
  animation-delay:-5s;
}

.blob-3 {
  top:40%;
  left:40%;
  width:40vw;
  height:40vw;
  background:#FF3366;
  opacity:calc(var(--blob-opacity) - .2);
  animation-delay:-10s;
}

@keyframes drift {
  0% {
    transform:translate(0,0) scale(1);
  }

  100% {
    transform:translate(80px,40px) scale(1.15);
  }
}

/* ================= HEADER ================= */

header {
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;

  padding:18px 0;

  background:rgba(11,14,20,.18);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid var(--border-color);

  transition:border-color .4s ease,background .4s ease;
}

body.light-mode header {
  background:rgba(244,247,251,.55);
}

.nav {
  max-width:1120px;
  margin:auto;
  padding:0 24px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo {
  font-family:'Space Grotesk',sans-serif;
  font-weight:800;
  font-size:22px;
  letter-spacing:-.5px;
}

.logo span {
  background:var(--gradient-text);
  -webkit-background-clip:text;
  color:transparent;
}

.nav-right {
  display:flex;
  align-items:center;
}

nav.links {
  display:flex;
  align-items:center;
}

nav.links a {
  color:var(--text-muted);
  text-decoration:none;
  margin-left:32px;

  font-size:13px;
  font-weight:600;

  text-transform:uppercase;
  letter-spacing:.5px;

  transition:color .2s ease;
}

nav.links a:hover {
  color:var(--text-main);
}

.theme-toggle {
  background:var(--card-bg);
  border:1px solid var(--border-color);

  border-radius:50%;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin-left:28px;

  cursor:pointer;
  font-size:18px;

  transition:all .3s ease;
}

.theme-toggle:hover {
  transform:scale(1.1);
}

/* MOBILE MENU */

.menu-toggle {
  display:none;

  background:var(--card-bg);
  border:1px solid var(--border-color);

  color:var(--text-main);

  width:40px;
  height:40px;

  border-radius:10px;

  font-size:20px;
  cursor:pointer;
}

.mobile-menu {
  display:none;

  position:absolute;
  top:76px;
  left:20px;
  right:20px;

  padding:15px;

  background:rgba(15,20,30,.92);
  backdrop-filter:blur(20px);

  border:1px solid var(--border-color);
  border-radius:18px;
}

body.light-mode .mobile-menu {
  background:rgba(255,255,255,.94);
}

.mobile-menu
